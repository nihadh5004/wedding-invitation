<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="paper-grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".7" fill="#173a32" opacity=".026"/>
      <circle cx="17" cy="16" r=".55" fill="#b39458" opacity=".035"/>
    </pattern>
    <filter id="envelope-shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="17" stdDeviation="18" flood-color="#173a32" flood-opacity=".22"/>
    </filter>
    <filter id="card-shadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102f28" flood-opacity=".25"/>
    </filter>
    <filter id="seal-shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#09271f" flood-opacity=".28"/>
    </filter>
    <style>
      .serif { font-family: "Bodoni MT", Didot, "Times New Roman", serif; }
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .botanical { fill: none; stroke: #788f82; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .gold-line { fill: none; stroke: #b39458; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Warm paper backdrop -->
  <rect width="1200" height="630" fill="#f3ecdf"/>
  <rect width="1200" height="630" fill="url(#paper-grain)"/>
  <rect x="24" y="24" width="1152" height="582" rx="3" fill="none" stroke="#b39458" stroke-width="1.2" opacity=".72"/>

  <!-- Restrained original botanical corner drawings -->
  <g opacity=".6">
    <path class="botanical" d="M24 177C91 159 142 109 179 25"/>
    <path class="botanical" d="M58 164C42 131 49 101 79 76c10 37 3 66-21 88Z"/>
    <path class="botanical" d="M102 132c1-40 20-69 57-85 0 40-19 69-57 85Z"/>
    <path class="botanical" d="M89 143c39-8 71 3 94 33-40 8-71-3-94-33Z"/>
    <path class="botanical" d="M145 83c34-12 63-5 86 20-35 12-63 5-86-20Z"/>
    <circle cx="47" cy="169" r="4" fill="none" stroke="#b39458" stroke-width="1.5"/>
  </g>

  <g transform="translate(1200 630) rotate(180)" opacity=".6">
    <path class="botanical" d="M24 177C91 159 142 109 179 25"/>
    <path class="botanical" d="M58 164C42 131 49 101 79 76c10 37 3 66-21 88Z"/>
    <path class="botanical" d="M102 132c1-40 20-69 57-85 0 40-19 69-57 85Z"/>
    <path class="botanical" d="M89 143c39-8 71 3 94 33-40 8-71-3-94-33Z"/>
    <path class="botanical" d="M145 83c34-12 63-5 86 20-35 12-63 5-86-20Z"/>
    <circle cx="47" cy="169" r="4" fill="none" stroke="#b39458" stroke-width="1.5"/>
  </g>

  <g opacity=".25">
    <path class="gold-line" d="M1175 133c-46-16-81-48-107-97"/>
    <path class="gold-line" d="M1146 122c13-28 10-52-11-70-10 28-6 52 11 70Z"/>
    <path class="gold-line" d="M1112 87c1-27-12-45-38-55-2 27 11 46 38 55Z"/>
    <path class="gold-line" d="M1123 101c-28-6-51 1-67 21 29 7 51 0 67-21Z"/>
  </g>

  <!-- Envelope group -->
  <g filter="url(#envelope-shadow)">
    <!-- Raised open flap behind the card -->
    <path d="M250 230 600 58 950 230 600 423Z" fill="#244f43"/>
    <path d="M250 230 600 58 950 230" class="gold-line" opacity=".7"/>
    <path d="M277 226 600 78 923 226" fill="none" stroke="#8da094" stroke-width="1" opacity=".34"/>

    <!-- Back pocket -->
    <rect x="250" y="220" width="700" height="340" rx="8" fill="#193f36"/>

    <!-- Invitation card partially emerging -->
    <g filter="url(#card-shadow)">
      <rect x="376" y="48" width="448" height="421" rx="4" fill="#fcf8ef"/>
      <rect x="390" y="62" width="420" height="393" rx="2" fill="none" stroke="#b39458" stroke-width="1.2"/>

      <text x="600" y="101" class="sans" fill="#667a6e" text-anchor="middle"
            font-size="12" font-weight="500" letter-spacing="4.8">TOGETHER WITH OUR FAMILIES</text>

      <g transform="translate(600 124)" fill="none" stroke="#b39458" stroke-width="1.1">
        <path d="M-82 0H-19M19 0H82"/>
        <path d="M0-7 7 0 0 7-7 0Z"/>
      </g>

      <text x="600" y="190" class="serif" fill="#153b32" text-anchor="middle"
            font-size="82" letter-spacing="-2">Jasir</text>
      <text x="600" y="238" class="serif" fill="#b39458" text-anchor="middle"
            font-size="39" font-style="italic">&amp;</text>
      <text x="600" y="306" class="serif" fill="#153b32" text-anchor="middle"
            font-size="82" letter-spacing="-2">Shesmin</text>

      <path d="M492 323H708" stroke="#b39458" stroke-width="1"/>
      <text x="600" y="354" class="sans" fill="#173a32" text-anchor="middle"
            font-size="21" font-weight="500" letter-spacing="5.5">16 · 08 · 2026</text>
    </g>

    <!-- Side folds and front flap -->
    <path d="M250 221 600 423 250 560Z" fill="#1c493e"/>
    <path d="M950 221 600 423 950 560Z" fill="#174338"/>
    <path d="M250 560 600 363 950 560Z" fill="#123b32"/>

    <path d="M250 221 600 423 950 221" fill="none" stroke="#d5c297" stroke-width="1" opacity=".5"/>
    <path d="M250 560 600 363 950 560" fill="none" stroke="#b39458" stroke-width="1.2" opacity=".68"/>

    <!-- Invitation line on the envelope -->
    <text x="600" y="516" class="serif" fill="#f4ecdc" text-anchor="middle"
          font-size="25" font-style="italic">
      With love, we invite you to celebrate with us
    </text>

    <!-- Floral monogram wax seal -->
    <g transform="translate(796 440)" filter="url(#seal-shadow)">
      <circle r="47" fill="#ad8950"/>
      <circle r="39" fill="#b9985e" stroke="#e5d4ad" stroke-width="1.2"/>
      <circle r="31" fill="none" stroke="#8d6b37" stroke-width=".8" opacity=".7"/>
      <path d="M-25-4c10-5 16-13 18-25M25-4c-10-5-16-13-18-25M-24 8c10 2 16 8 20 19M24 8c-10 2-16 8-20 19"
            fill="none" stroke="#f7edda" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
      <path d="M-8-22c-8-2-12 2-13 10 8 0 12-3 13-10ZM8-22c8-2 12 2 13 10-8 0-12-3-13-10ZM-5 21c-8 0-12-4-12-12 8 1 12 5 12 12ZM5 21c8 0 12-4 12-12-8 1-12 5-12 12Z"
            fill="none" stroke="#f7edda" stroke-width="1"/>
      <text x="0" y="7" class="serif" fill="#fff8ea" text-anchor="middle"
            font-size="20" font-weight="500">J &amp; S</text>
    </g>
  </g>

  <!-- Small balancing ornaments -->
  <g transform="translate(172 514)" fill="none" stroke="#b39458" stroke-width="1" opacity=".65">
    <path d="M-40 0H-10M10 0H40"/>
    <circle r="6"/>
    <path d="M0-4 4 0 0 4-4 0Z"/>
  </g>
  <g transform="translate(1028 116)" fill="none" stroke="#b39458" stroke-width="1" opacity=".65">
    <path d="M-40 0H-10M10 0H40"/>
    <circle r="6"/>
    <path d="M0-4 4 0 0 4-4 0Z"/>
  </g>
</svg>
